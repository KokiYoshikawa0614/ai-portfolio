<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title"><title id="title">音声の長さにスライドとアバターを合わせる設計</title><rect width="1000" height="420" rx="22" fill="#eaf0e3"/><g font-family="sans-serif" fill="#234b3c"><text x="40" y="55" font-size="13" letter-spacing="2">AUDIO-DRIVEN TIMELINE</text><text x="40" y="101" font-size="27" font-weight="bold">音声の尺を、すべての時間基準に。</text><text x="40" y="175" font-size="17">ナレーション</text><text x="40" y="254" font-size="17">スライド</text><text x="40" y="329" font-size="17">アバター</text><g stroke="#879c73" stroke-dasharray="5 6"><path d="M230 135v220M480 135v220M770 135v220M950 135v220"/></g><g fill="#234b3c"><rect x="230" y="146" width="240" height="48" rx="7"/><rect x="490" y="146" width="270" height="48" rx="7"/><rect x="780" y="146" width="170" height="48" rx="7"/></g><path d="M249 169h13l6-12 8 25 8-21 8 15 8-8h28l9-12 8 28 8-19 8 10 8-7h55M510 169h17l8-13 8 26 8-20 8 14 8-8h35l8-14 8 29 8-21 8 13 8-7h76M800 169h15l7-12 8 25 8-21 8 14 8-7h72" fill="none" stroke="#d8e9ac" stroke-width="2"/><g fill="#c8d6b6"><rect x="230" y="222" width="240" height="48" rx="7"/><rect x="490" y="222" width="270" height="48" rx="7"/><rect x="780" y="222" width="170" height="48" rx="7"/></g><text x="290" y="252" font-size="16">スライド A</text><text x="565" y="252" font-size="16">スライド B</text><text x="815" y="252" font-size="16">スライド C</text><rect x="230" y="298" width="240" height="48" rx="7" fill="#d9c8a6"/><text x="285" y="328" font-size="16">必要な場面のみ</text><text x="507" y="328" font-size="15" fill="#647260">本編はスライド＋ナレーション</text><text x="40" y="389" font-size="13" fill="#647260">音声を修正したら、その長さに合わせて映像も再生成。図の区間幅は説明用です。</text></g></svg>
