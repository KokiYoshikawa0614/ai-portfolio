<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title"><title id="title">標準16枚のうちアバターを表示するのは冒頭2枚と最終1枚</title><rect width="1000" height="330" rx="22" fill="#f0ece2"/><g font-family="sans-serif" fill="#234b3c"><text x="40" y="51" font-size="13" letter-spacing="2">AVATAR PLACEMENT</text><text x="40" y="98" font-size="27" font-weight="bold">講師が必要な3枚に、生成を絞る。</text><g fill="#deded2" stroke="#c4cabc"><rect x="40" y="148" width="48" height="67" rx="5" fill="#234b3c"/><rect x="98" y="148" width="48" height="67" rx="5" fill="#234b3c"/><rect x="156" y="148" width="48" height="67" rx="5"/><rect x="214" y="148" width="48" height="67" rx="5"/><rect x="272" y="148" width="48" height="67" rx="5"/><rect x="330" y="148" width="48" height="67" rx="5"/><rect x="388" y="148" width="48" height="67" rx="5"/><rect x="446" y="148" width="48" height="67" rx="5"/><rect x="504" y="148" width="48" height="67" rx="5"/><rect x="562" y="148" width="48" height="67" rx="5"/><rect x="620" y="148" width="48" height="67" rx="5"/><rect x="678" y="148" width="48" height="67" rx="5"/><rect x="736" y="148" width="48" height="67" rx="5"/><rect x="794" y="148" width="48" height="67" rx="5"/><rect x="852" y="148" width="48" height="67" rx="5"/><rect x="910" y="148" width="48" height="67" rx="5" fill="#234b3c"/></g><g fill="#f3f5eb" font-size="18"><text x="54" y="189">01</text><text x="112" y="189">02</text><text x="924" y="189">16</text></g><text x="40" y="250" font-size="15">冒頭：講師の導入</text><text x="370" y="250" font-size="15">本編：スライドと音声</text><text x="823" y="250" font-size="15">最後：締めくくり</text><text x="40" y="296" font-size="13" fill="#647260">標準16枚構成の設計例。アバターを一切使用しない出力にも対応。</text></g></svg>
